name: Publish Dart

# pub.dev only accepts automated publishing from a workflow triggered by a push of
# a tag matching the pattern configured on pub.dev, which for this package is
# dart-v{{version}}. Nx still owns the publish; it just runs in a tag-triggered
# job. setup-dart mints a short-lived credential from id-token, so there is no
# pub.dev secret in this repository.
on:
  push:
    tags:
      - 'dart-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Dart package version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/node/pnpm-lock.yaml

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: |
          pnpm install --dir packages/node --frozen-lockfile
          dart pub get -C packages/dart

      - name: Confirm the tag matches the package version
        env:
          DISPATCHED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#dart-v}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tagged="$DISPATCHED_VERSION"
          fi
          declared="$(node -e "
            const {readFileSync} = require('node:fs');
            const pubspec = readFileSync('packages/dart/pubspec.yaml', 'utf8');
            process.stdout.write(pubspec.match(/^version:\s*(\S+)/m)[1]);
          ")"
          if [[ "$tagged" != "$declared" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $declared." >&2
            exit 1
          fi
          echo "Publishing mace-dart $declared"

      - name: Publish Dart through Nx Release
        run: node .nx/nxw.js release publish --groups=dart --nxBail
