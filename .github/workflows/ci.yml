name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace checks
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout mace
        uses: actions/checkout@v5
        with:
          repository: louiss0/mace
          path: mace

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: mace/go.mod
          cache: true
          cache-dependency-path: mace/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/node/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: |
          pnpm install --dir packages/node --frozen-lockfile
          dart pub get -C packages/dart

      # CI stages with plain go build rather than tools/native/stage-local.nu, which
      # needs Nushell and a local sibling checkout. The runner is a known target.
      - name: Stage a native library for the host
        run: |
          set -euo pipefail
          target=linux-amd64-glibc
          library=libmace_processor.so
          go -C mace build -buildmode=c-shared -o "$RUNNER_TEMP/$library" ./cmd/processor-abi
          MACE_PROCESSOR_LIBRARY="$RUNNER_TEMP/$library" python3 mace/cmd/processor-abi/abi_test.py
          for package in packages/node packages/python/src/mace_python packages/dart; do
            mkdir -p "$package/bin/$target"
            cp "$RUNNER_TEMP/$library" "$package/bin/$target/$library"
          done

      - name: Check and test
        run: |
          npm run check
          npm run test

  platforms:
    name: ${{ matrix.target }}
    needs: workspace
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            os: macos-15-intel
          - target: darwin-arm64
            os: macos-14
          - target: windows-amd64
            os: windows-2022
          - target: linux-amd64-glibc
            os: ubuntu-24.04
          - target: linux-arm64-glibc
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      NX_DAEMON: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/node/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: |
          pnpm install --dir packages/node --frozen-lockfile
          dart pub get -C packages/dart

      - name: Stage the pinned processor artifact
        run: node tools/native/stage-release.mjs "" "${{ matrix.target }}"

      - name: Test the installed packages
        run: |
          npm run check
          npm run test
