name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      processor_version:
        description: Published processor/vX.Y.Z version to stage instead of a local build
        required: false

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace checks
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout mace
        uses: actions/checkout@v5
        with:
          repository: louiss0/mace
          path: mace

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: mace/go.mod
          cache: true
          cache-dependency-path: mace/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/node/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: |
          pnpm install --dir packages/node --frozen-lockfile
          dart pub get -C packages/dart

      # CI stages with plain go build rather than tools/native/stage-local.nu, which
      # needs Nushell and a local sibling checkout. The runner is a known target.
      - name: Stage a native library for the host
        run: |
          set -euo pipefail
          target=linux-amd64-glibc
          library=libmace_processor.so
          go -C mace build -buildmode=c-shared -o "$RUNNER_TEMP/$library" ./cmd/processor-abi
          MACE_PROCESSOR_LIBRARY="$RUNNER_TEMP/$library" python3 mace/cmd/processor-abi/abi_test.py
          for package in packages/node packages/python/src/mace_python packages/dart; do
            mkdir -p "$package/bin/$target"
            cp "$RUNNER_TEMP/$library" "$package/bin/$target/$library"
          done

      - name: Check and test
        run: |
          npm run check
          npm run test

  platforms:
    name: ${{ matrix.target }}
    needs: workspace
    if: ${{ inputs.processor_version != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            os: macos-13
            container: ''
            dart: true
          - target: darwin-arm64
            os: macos-14
            container: ''
            dart: true
          - target: windows-amd64
            os: windows-2022
            container: ''
            dart: true
          - target: windows-arm64
            os: windows-11-arm
            container: ''
            dart: true
          - target: linux-amd64-glibc
            os: ubuntu-24.04
            container: ''
            dart: true
          - target: linux-arm64-glibc
            os: ubuntu-24.04-arm
            container: ''
            dart: true
          # The Dart SDK ships no musl build, so musl variants cover Node and Python.
          - target: linux-amd64-musl
            os: ubuntu-24.04
            container: alpine:3.20
            dart: false
          - target: linux-arm64-musl
            os: ubuntu-24.04-arm
            container: alpine:3.20
            dart: false
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      NX_DAEMON: 'false'
    steps:
      - name: Install Alpine tooling
        if: ${{ matrix.container != '' }}
        run: apk add --no-cache bash git nodejs npm

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        if: ${{ matrix.container == '' }}
        with:
          version: 10

      - name: Enable pnpm
        if: ${{ matrix.container != '' }}
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v5
        if: ${{ matrix.container == '' }}
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/node/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        if: ${{ matrix.dart }}

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --dir packages/node --frozen-lockfile
          if [[ "${{ matrix.dart }}" == "true" ]]; then
            dart pub get -C packages/dart
          fi

      - name: Stage the published processor artifact
        shell: bash
        run: node tools/native/stage-release.mjs "${{ inputs.processor_version }}" "${{ matrix.target }}"

      - name: Test the installed packages
        shell: bash
        run: |
          if [[ "${{ matrix.dart }}" == "true" ]]; then
            npm run check
          else
            npm run check:node-python
          fi
          if [[ "${{ matrix.dart }}" == "true" ]]; then
            npm run test
          else
            npm run test:node-python
          fi

  platforms-unpinned:
    name: Platform matrix needs a pinned processor release
    needs: workspace
    if: ${{ inputs.processor_version == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the missing pin
        run: |
          echo "Set the processor_version input to a published processor/vX.Y.Z version to test all eight variants." >&2
          exit 1
