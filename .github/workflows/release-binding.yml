name: Release one binding

# Releases a single binding, so each language can be shipped and verified on its
# own instead of all three in one run.
#
# Dart is the exception: pub.dev only accepts a workflow triggered by a matching
# tag push, so selecting dart verifies here and then pushes the tag that runs
# .github/workflows/publish-dart.yml. It never publishes from this dispatch run.
on:
  workflow_dispatch:
    inputs:
      binding:
        description: Binding to release
        type: choice
        required: true
        default: node
        options:
          - node
          - python
          - dart
          - all
      version:
        description: Nx specifier to version with, for example major or minor
        required: false
      skip_versioning:
        description: Release the version already on disk
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the release groups
        run: |
          set -euo pipefail
          groups="${{ inputs.binding }}"
          if [[ "$groups" == "all" ]]; then
            groups="node,python,dart"
          fi
          case "$groups" in
            node|python|dart|node,python,dart) ;;
            *) echo "Unknown binding: $groups" >&2; exit 1 ;;
          esac
          echo "GROUPS=$groups" >> "$GITHUB_ENV"
          # GROUP_LIST is the same list padded with commas so a publish step can
          # test for a whole group name. The raw input cannot be used for that:
          # it is the literal string that was dispatched, and `all` does not
          # contain `node`.
          echo "GROUP_LIST=,$groups," >> "$GITHUB_ENV"
          echo "Releasing: $groups"

      - name: Version, commit, and tag
        if: ${{ !inputs.skip_versioning }}
        run: |
          set -euo pipefail
          specifier="${{ inputs.version }}"
          if [[ -z "$specifier" ]]; then
            echo "Give a version specifier, or set skip_versioning." >&2
            exit 1
          fi
          # Tags are pushed only after verification. The Dart tag is pushed last
          # because its push is what triggers the pub.dev publish.
          node .nx/nxw.js release version "$specifier" \
            --groups="$GROUPS" --git-commit --git-tag

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/node/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: |
          pnpm install --dir packages/node --frozen-lockfile
          dart pub get -C packages/dart

      # Without this the Python build cannot bundle an sdist or tag a wheel.
      - name: Stage the pinned processor artifacts
        run: node tools/native/stage-release.mjs

      - name: Validate workspace
        run: |
          npm run check
          npm run test

      - name: Build the selected distributions
        run: |
          set -euo pipefail
          if [[ "$GROUPS" == *node* ]]; then
            pnpm --dir packages/node run build
          fi
          if [[ "$GROUPS" == *python* ]]; then
            node tools/release/build-python.mjs
          fi

      - name: Prove the publish command succeeds without publishing
        env:
          NX_DRY_RUN: 'true'
        run: node .nx/nxw.js release publish --groups="$GROUPS" --nxBail

      # A commit exists only when the version step ran and created one.
      - name: Push the version commit
        if: ${{ !inputs.skip_versioning }}
        run: git push origin HEAD:main

      # The registry tokens live in 1Password, not in GitHub secrets. They are
      # resolved here, after the dry run has passed, so neither token is in the
      # environment of the build, test, or versioning steps above. The service
      # account token is the only GitHub secret involved; it must have read
      # access to both items in the Development vault.
      - name: Load the registry tokens from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NODE_AUTH_TOKEN: op://Development/Code Fixer 23 NPM Token/credential
          UV_PUBLISH_TOKEN: op://Development/PY_TOKEN/credential

      - name: Publish Node
        if: ${{ contains(env.GROUP_LIST, ',node,') }}
        run: node .nx/nxw.js release publish --groups=node --nxBail

      - name: Publish Python
        if: ${{ contains(env.GROUP_LIST, ',python,') }}
        run: node .nx/nxw.js release publish --groups=python --nxBail

      - name: Push the Node and Python tags
        if: ${{ contains(env.GROUP_LIST, ',node,') || contains(env.GROUP_LIST, ',python,') }}
        run: git push origin $(git tag --list 'node-v*' 'python-v*')

      - name: Trigger the Dart publish
        if: ${{ contains(env.GROUP_LIST, ',dart,') }}
        run: git push origin $(git tag --list 'dart-v*')
