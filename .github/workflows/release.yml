name: Release

# Nx owns package versioning, tagging, and publication. The processor libraries
# come from the release pinned in tools/native/processor.json, verified against
# the published manifest before any of them is bundled.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Nx specifier to version with, for example major or minor
        required: false
      skip_versioning:
        description: Publish the versions already on disk
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/node/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Version, commit, and tag
        if: ${{ !inputs.skip_versioning }}
        env:
          NX_DAEMON: 'false'
        run: |
          set -euo pipefail
          specifier="${{ inputs.version }}"
          if [[ -z "$specifier" ]]; then
            echo "Give a version specifier, or set skip_versioning to publish the versions on disk." >&2
            exit 1
          fi
          node .nx/nxw.js release version "$specifier" \
            --groups=node,python,dart --git-commit --git-tag --git-push

      - name: Install dependencies
        run: |
          pnpm install --dir packages/node --frozen-lockfile
          dart pub get -C packages/dart

      # Without this the Python build cannot bundle an sdist or tag a wheel.
      - name: Stage the pinned processor artifacts
        run: node tools/native/stage-release.mjs

      - name: Validate workspace
        run: |
          npm run check
          npm run test

      - name: Build every distribution
        run: |
          pnpm --dir packages/node run build
          node tools/release/build-python.mjs

      - name: Prove the publish commands succeed without publishing
        env:
          NX_DRY_RUN: 'true'
        run: node .nx/nxw.js release publish --groups=node,python,dart --nxBail

      - name: Load publish credentials
        id: load_secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NODE_AUTH_TOKEN: "op://Development/Code Fixer 23 NPM Token/credential"
          UV_PUBLISH_TOKEN: "op://Development/PY_TOKEN/credential"

      - name: Write Dart publish credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p ~/.dart
          echo "$PUB_CREDENTIALS" > ~/.dart/pub-credentials.json

      - name: Publish bindings through Nx Release
        env:
          NX_DAEMON: 'false'
        run: node .nx/nxw.js release publish --groups=node,python,dart --nxBail
