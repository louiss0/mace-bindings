name: Release

# Publication stays blocked until native artifacts pass the eight-variant gate.
# Nx owns package versioning, tagging, and publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Prevent incomplete native release
        run: |
          echo "Verified processor artifacts, installed-package platform tests, and the Dart tag-push OIDC job are not configured yet." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/node/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: |
          pnpm install --dir packages/node --frozen-lockfile
          dart pub get -C packages/dart

      - name: Validate workspace
        run: |
          npm run check
          npm run test

      - name: Build packages
        run: npm run build

      - name: Load publish credentials
        id: load_secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NODE_AUTH_TOKEN: "op://Development/Code Fixer 23 NPM Token/credential"
          UV_PUBLISH_TOKEN: "op://Development/PY_TOKEN/credential"

      - name: Write Dart publish credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p ~/.dart
          echo "$PUB_CREDENTIALS" > ~/.dart/pub-credentials.json

      - name: Publish bindings through Nx Release
        env:
          NX_DAEMON: 'false'
        run: node .nx/nxw.js release publish --groups=node,python,dart --nxBail
