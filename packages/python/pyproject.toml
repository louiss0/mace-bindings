[project]
name = "mace-python"
version = "3.0.0"
description = "Official Python bindings for Mace"
readme = "README.md"
authors = [
    { name = "the-code-fixer-23" }
]
maintainers = [
    { name = "the-code-fixer-23" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mace_python"]
exclude = ["*.h", "/src/mace_python/bin/**"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/hatch_build.py", "/native_targets.json", "/pyproject.toml"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
